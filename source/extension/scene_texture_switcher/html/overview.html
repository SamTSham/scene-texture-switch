<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene Texture Overview</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f3;
      --panel: #ffffff;
      --text: #171717;
      --muted: #707070;
      --line: #d8d8d6;
      --hover: #eeeeec;
      --selected: #e5eef9;
      --current: #2c76c7;
      --ready: #171717;
      --incomplete: #e03b32;
      --missing: #bcbcbc;
      --conflict: #d38a16;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #282828;
        --panel: #323232;
        --text: #f0f0f0;
        --muted: #aeaeae;
        --line: #4a4a4a;
        --hover: #3a3a3a;
        --selected: #35485d;
        --ready: #eeeeee;
        --missing: #777777;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    button {
      border: 0;
      border-radius: 5px;
      padding: 5px 8px;
      color: inherit;
      background: transparent;
      font: inherit;
    }

    button:hover { background: var(--hover); }

    .library {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      min-height: 25px;
      padding: 2px 5px 2px 9px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .library-name {
      display: flex;
      gap: 7px;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend-item {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .legend-item .dot {
      width: 7px;
      height: 7px;
    }

    .refresh {
      min-width: 24px;
      min-height: 21px;
      padding: 1px 5px;
      font-size: 14px;
      line-height: 1;
    }

    .rows { overflow: auto; }

    .empty {
      padding: 24px 16px;
      color: var(--muted);
      text-align: center;
    }

    .row {
      position: relative;
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) 46px 32px;
      gap: 5px;
      align-items: center;
      min-height: 30px;
      padding: 3px 7px 3px 9px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      cursor: default;
      user-select: none;
    }

    .row:hover { background: var(--hover); }
    .row.selected { background: var(--selected); }
    .row.current::before {
      position: absolute;
      inset: 3px auto 3px 0;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--current);
      content: "";
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--missing);
    }

    .dot.ready { background: var(--ready); }
    .dot.incomplete { background: var(--incomplete); }
    .dot.missing { background: var(--missing); }
    .dot.conflict {
      border-radius: 2px;
      background: var(--conflict);
      transform: rotate(45deg) scale(.82);
    }

    .scene { min-width: 0; }
    .scene-name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 560;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scene-detail {
      display: none;
    }

    .cue {
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 4px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .cue:hover, .cue:focus { border-color: var(--current); }

    .count {
      color: var(--muted);
      text-align: right;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 25px;
      padding: 3px 7px 3px 9px;
      border-top: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 10px;
    }

    .picker-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, .24);
    }

    .picker-backdrop[hidden] { display: none; }

    .picker {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(310px, 100%);
      max-height: min(390px, calc(100vh - 36px));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .28);
    }

    .picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
    }

    .picker-title {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      overflow: auto;
      padding: 9px;
    }

    .picker-option {
      display: grid;
      grid-template-columns: 10px 1fr;
      gap: 5px;
      align-items: center;
      min-height: 32px;
      border: 1px solid var(--line);
      background: var(--bg);
      font-variant-numeric: tabular-nums;
    }

    .picker-option:hover, .picker-option:focus { border-color: var(--current); }
    .picker-option.active {
      border-color: var(--current);
      box-shadow: inset 0 0 0 1px var(--current);
    }

    .picker-option .dot { width: 8px; height: 8px; }

    .preview-card {
      position: fixed;
      z-index: 15;
      width: min(270px, calc(100vw - 12px));
      max-height: min(310px, calc(100vh - 12px));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .26);
    }

    .preview-card[hidden] { display: none; }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      max-height: 270px;
      overflow: auto;
      padding: 6px;
    }
    .preview-tile {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      padding: 3px;
      background: var(--bg);
    }
    .preview-tile:hover, .preview-tile:focus { border-color: var(--current); }
    .preview-tile img {
      display: block;
      width: 100%;
      height: 86px;
      object-fit: contain;
      background: #1e1e1e;
    }
    .preview-label {
      display: block;
      overflow: hidden;
      padding-top: 3px;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-hint {
      padding: 4px 7px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="library">
      <span class="library-name" id="library">Reading texture library…</span>
      <button type="button" class="refresh" id="refresh" title="Reload current scene textures from disk" aria-label="Reload current scene textures from disk">&#x21bb;</button>
    </div>
    <main class="rows" id="rows"></main>
    <footer>
      <span id="summary">Reading scenes…</span>
    </footer>
  </div>
  <div class="picker-backdrop" id="pickerBackdrop" hidden>
    <section class="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="picker-header">
        <span class="picker-title" id="pickerTitle">Assign texture</span>
        <button type="button" id="pickerClose" aria-label="Close texture picker">&#x2715;</button>
      </div>
      <div class="picker-grid" id="pickerGrid"></div>
    </section>
  </div>
  <aside class="preview-card" id="previewCard" hidden>
    <div class="preview-grid" id="previewGrid"></div>
    <div class="preview-hint">Z — large preview &nbsp;·&nbsp; click image</div>
  </aside>

  <script>
    (() => {
      const rowsElement = document.getElementById('rows');
      const libraryElement = document.getElementById('library');
      const summaryElement = document.getElementById('summary');
      const pickerBackdrop = document.getElementById('pickerBackdrop');
      const pickerGrid = document.getElementById('pickerGrid');
      const pickerTitle = document.getElementById('pickerTitle');
      const previewCard = document.getElementById('previewCard');
      const previewGrid = document.getElementById('previewGrid');
      let selectedKey = null;
      let currentData = null;
      let pickerScene = null;
      let previewTimer = null;
      let activePreviewAsset = null;
      let activePreviewScene = null;

      const labels = {
        ready: 'ready',
        incomplete: 'incomplete',
        missing: 'missing',
        conflict: 'conflict'
      };

      function escapeText(value) {
        const span = document.createElement('span');
        span.textContent = value == null ? '' : String(value);
        return span.innerHTML;
      }

      function detailFor(scene) {
        if (scene.status === 'ready') return 'All required textures present';
        if (scene.status === 'incomplete') return `Missing: ${scene.missing_surfaces.join(', ')}`;
        if (scene.status === 'conflict') return 'Texture library needs attention';
        return scene.required_count ? 'No textures prepared' : 'Surface folders unavailable';
      }

      function libraryProblem(library) {
        if (library.status === 'found') return null;
        if (library.status === 'ambiguous') return `Several texture folders found: ${library.candidates.join(', ')}`;
        if (library.status === 'associated_missing') return `Chosen texture folder is missing: ${library.preferred_name}`;
        if (library.status === 'error') return library.message || 'Texture folder could not be read';
        return 'No compatible texture folder found beside this model';
      }

      function defaultGuide(library) {
        const problem = libraryProblem(library);
        if (problem) {
          libraryElement.textContent = problem;
          return;
        }
        libraryElement.innerHTML = `
          <span class="legend-item"><span class="dot ready"></span>ready</span>
          <span class="legend-item"><span class="dot incomplete"></span>incomplete</span>
          <span class="legend-item"><span class="dot missing"></span>missing</span>
          <span class="legend-item"><span class="dot conflict"></span>conflict</span>`;
      }

      function temporaryGuide(text) {
        libraryElement.textContent = text;
      }

      function render(data) {
        currentData = data;
        defaultGuide(data.library);
        rowsElement.innerHTML = '';

        if (!data.scenes.length) {
          rowsElement.innerHTML = '<div class="empty">This model has no scenes.</div>';
        } else {
          data.scenes.forEach((scene) => {
            const row = document.createElement('div');
            row.className = `row${scene.current ? ' current' : ''}${selectedKey === scene.scene_key ? ' selected' : ''}`;
            row.dataset.sceneKey = scene.scene_key;
            row.title = `${scene.scene_name} — ${labels[scene.status] || scene.status}`;
            row.innerHTML = `
              <span class="dot ${escapeText(scene.status)}" aria-label="${escapeText(labels[scene.status] || scene.status)}"></span>
              <span class="scene">
                <span class="scene-name">${escapeText(scene.scene_name)}</span>
                <span class="scene-detail">${escapeText(detailFor(scene))}</span>
              </span>
              <button type="button" class="cue" aria-label="Assign texture for ${escapeText(scene.scene_name)}">${escapeText(scene.texture_index)}</button>
              <span class="count">${scene.present_count}/${scene.required_count}</span>`;
            row.addEventListener('click', () => {
              selectedKey = scene.scene_key;
              rowsElement.querySelectorAll('.row').forEach((item) => item.classList.toggle('selected', item === row));
              summaryElement.textContent = `${scene.scene_name}: ${detailFor(scene)}`;
            });
            row.addEventListener('dblclick', () => {
              if (window.sketchup) window.sketchup.activateScene(scene.scene_key);
            });
            row.addEventListener('mouseenter', () => temporaryGuide(`${labels[scene.status] || scene.status}: ${detailFor(scene)}`));
            row.addEventListener('mouseleave', () => defaultGuide(currentData.library));
            row.querySelector('.cue').addEventListener('click', (event) => {
              event.stopPropagation();
              openPicker(scene);
            });
            row.querySelector('.cue').addEventListener('dblclick', (event) => event.stopPropagation());
            row.querySelector('.cue').addEventListener('mouseenter', (event) => {
              event.stopPropagation();
              temporaryGuide(`Click to assign a texture state to ${scene.scene_name}`);
              schedulePreview(event.currentTarget, scene);
            });
            row.querySelector('.cue').addEventListener('mouseleave', schedulePreviewHide);
            rowsElement.appendChild(row);
          });
        }

        const attention = data.summary.attention;
        summaryElement.textContent = attention === 0
          ? `${data.summary.scene_count} scenes ready`
          : `${attention} ${attention === 1 ? 'scene needs' : 'scenes need'} attention`;
      }

      function stateForCue(cue) {
        return currentData && currentData.texture_states
          ? currentData.texture_states.find((state) => state.texture_index === cue)
          : null;
      }

      function schedulePreview(anchor, scene) {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => showPreview(anchor, scene), 350);
      }

      function schedulePreviewHide() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(hidePreview, 160);
      }

      function showPreview(anchor, scene) {
        const state = stateForCue(scene.texture_index);
        const files = state && state.preview_files ? state.preview_files : [];
        if (!files.length) {
          hidePreview();
          return;
        }

        activePreviewScene = scene;
        activePreviewAsset = files[0];
        previewGrid.innerHTML = '';
        files.forEach((asset) => {
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'preview-tile';
          tile.title = `${asset.surface} — ${asset.filename}`;
          tile.innerHTML = `<img src="${escapeText(asset.url)}" alt="${escapeText(asset.surface)}"><span class="preview-label">${escapeText(asset.surface)}</span>`;
          tile.addEventListener('mouseenter', () => { activePreviewAsset = asset; });
          tile.addEventListener('focus', () => { activePreviewAsset = asset; });
          tile.addEventListener('click', () => zoomPreview(asset));
          previewGrid.appendChild(tile);
        });

        previewCard.hidden = false;
        const anchorRect = anchor.getBoundingClientRect();
        const cardRect = previewCard.getBoundingClientRect();
        const left = Math.max(6, Math.min(window.innerWidth - cardRect.width - 6, anchorRect.right - cardRect.width));
        const below = anchorRect.bottom + 4;
        const top = below + cardRect.height <= window.innerHeight - 6
          ? below
          : Math.max(6, anchorRect.top - cardRect.height - 4);
        previewCard.style.left = `${left}px`;
        previewCard.style.top = `${top}px`;
      }

      function hidePreview() {
        previewCard.hidden = true;
        activePreviewAsset = null;
        activePreviewScene = null;
      }

      function zoomPreview(asset) {
        if (!asset || !activePreviewScene || !window.sketchup || !window.sketchup.zoomPreview) return;
        window.sketchup.zoomPreview(asset.path, `${activePreviewScene.texture_index} · ${asset.surface}`);
      }

      function openPicker(scene) {
        pickerScene = scene;
        pickerTitle.textContent = `Texture for ${scene.scene_name}`;
        pickerGrid.innerHTML = '';
        currentData.texture_states.forEach((state) => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = `picker-option${state.texture_index === scene.texture_index ? ' active' : ''}`;
          option.title = `${state.texture_index} — ${labels[state.status] || state.status} (${state.present_count}/${state.required_count})`;
          option.innerHTML = `<span class="dot ${escapeText(state.status)}"></span><span>${escapeText(state.texture_index)}</span>`;
          option.addEventListener('click', () => assignTexture(state.texture_index));
          pickerGrid.appendChild(option);
        });
        pickerBackdrop.hidden = false;
        const active = pickerGrid.querySelector('.active');
        if (active) active.scrollIntoView({ block: 'center' });
      }

      function closePicker() {
        pickerBackdrop.hidden = true;
        pickerScene = null;
      }

      function assignTexture(cue) {
        if (!pickerScene || !window.sketchup) return;
        const sceneKey = pickerScene.scene_key;
        closePicker();
        window.sketchup.setCue(sceneKey, cue);
      }

      function previewData() {
        const names = [
          '01 Opening', '02 Hotel', '03 Finale', '04 Curtain Transition',
          '05 Kitchen / Evening', '06 Empty Stage', '07 Interval',
          '08 Very Long Scene Name for a Scenic Transition Test',
          '09 Return', '10 Finale Reset', '11 Shared Texture State',
          '12 Missing Projection Content'
        ];
        const states = ['ready', 'ready', 'incomplete', 'ready', 'conflict', 'missing'];
        const scenes = names.map((name, index) => {
          const status = states[index % states.length];
          const present = status === 'ready' ? 3 : status === 'missing' ? 0 : 2;
          return {
            scene_key: `preview-${index}`,
            scene_name: name,
            texture_index: String((index % 8) + 1).padStart(2, '0'),
            status,
            present_count: present,
            required_count: 3,
            missing_surfaces: present === 3 ? [] : ['Surface03'],
            conflicts: [],
            current: index === 2
          };
        });
        const counts = (status) => scenes.filter((scene) => scene.status === status).length;
        const sampleImage = (number) => `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180"><rect width="100%" height="100%" fill="#333"/><text x="50%" y="58%" text-anchor="middle" font-family="sans-serif" font-size="84" fill="white">${number}</text></svg>`)}`;
        return {
          library: { status: 'found', name: 'Textures — Preview Project', candidates: [] },
          scenes,
          texture_states: Array.from({ length: 99 }, (_, index) => {
            const status = states[index % states.length];
            return {
              texture_index: String(index + 1).padStart(2, '0'),
              status,
              present_count: status === 'ready' ? 3 : status === 'missing' ? 0 : 2,
              required_count: 3,
              preview_files: index < 3 ? [
                {
                  surface: 'Surface01', filename: 'Surface01.png',
                  path: '/preview/Surface01.png', url: sampleImage(index + 1)
                },
                {
                  surface: 'Surface02', filename: 'Surface02.png',
                  path: '/preview/Surface02.png', url: sampleImage(index + 1)
                }
              ] : []
            };
          }),
          summary: {
            scene_count: scenes.length,
            ready: counts('ready'),
            incomplete: counts('incomplete'),
            missing: counts('missing'),
            conflict: counts('conflict'),
            attention: scenes.filter((scene) => scene.status !== 'ready').length
          }
        };
      }

      window.SceneTextureOverview = { render };
      document.getElementById('pickerClose').addEventListener('click', closePicker);
      document.getElementById('refresh').addEventListener('mouseenter', () => temporaryGuide('Reload current scene textures after editing image files'));
      document.getElementById('refresh').addEventListener('mouseleave', () => {
        if (currentData) defaultGuide(currentData.library);
      });
      pickerBackdrop.addEventListener('click', (event) => {
        if (event.target === pickerBackdrop) closePicker();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closePicker();
        if (event.key.toLowerCase() === 'z' && activePreviewAsset) {
          event.preventDefault();
          zoomPreview(activePreviewAsset);
        }
      });
      previewCard.addEventListener('mouseenter', () => clearTimeout(previewTimer));
      previewCard.addEventListener('mouseleave', schedulePreviewHide);
      document.getElementById('refresh').addEventListener('click', () => {
        if (window.sketchup) window.sketchup.reloadCurrent();
      });
      window.addEventListener('load', () => {
        if (window.sketchup) {
          window.sketchup.requestSnapshot();
        } else if (new URLSearchParams(window.location.search).has('preview')) {
          render(previewData());
        }
      });
    })();
  </script>
</body>
</html>
